[build]
  command = "npm run build"
  publish = "dist"

# NOTE: there is deliberately no "/*  ->  /index.html  200" SPA fallback here
# any more. Every route is prerendered into its own index.html at build time
# (scripts/prerender.mjs), so the filesystem answers them directly. Unmatched
# paths fall through to dist/404.html with a real 404 status instead of being
# answered 200 with an empty shell.

# The content plan's agreed URL, kept alive at the edge as well as in the app.
[[redirects]]
  from = "/africa"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
