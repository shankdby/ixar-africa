[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback. Duplicated in public/_redirects so the rule survives if this
# file is ignored by a different host.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The content plan's agreed URL, kept alive at the edge as well as in the app.
[[redirects]]
  from = "/africa"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
