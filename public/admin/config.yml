# IXAR Africa — content configuration for Decap CMS.
#
# Editors sign in at /admin. Saving writes the JSON files under src/content
# straight back to this repository as a commit, which triggers a rebuild and a
# redeploy. There is no server to run and no database to back up: the content
# and its history are the git history.
#
# ACCESS. The site is on Vercel, so this uses the GitHub backend rather than
# Netlify Identity. Signing in means signing in to GitHub, and only accounts
# with write access to this repository can save. Add or remove an editor in
# GitHub → Settings → Collaborators.
#
# The OAuth handshake is served by this same deployment: /api/auth starts it and
# /api/callback finishes it. Both need GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
# set in the Vercel project. See docs/cms.md.

backend:
  name: github
  repo: shankdby/ixar-africa
  branch: main
  base_url: https://ixar.africa      # change if the domain changes
  auth_endpoint: api/auth
  commit_messages:
    update: 'content: update {{collection}} ({{author-login}})'
    delete: 'content: remove from {{collection}} ({{author-login}})'
    uploadMedia: 'content: upload {{path}} ({{author-login}})'
    deleteMedia: 'content: delete {{path}} ({{author-login}})'

publish_mode: editorial_workflow

media_folder: public/images/east-africa
public_folder: /images/east-africa

locale: en

collections:
  - name: projects
    label: Projects
    label_singular: project
    description: >-
      The experience record shown on the homepage. Work order value is
      deliberately not published; do not add it. Client and project are
      separate columns, and Year is a single year with no ranges.
    files:
      - name: projects
        label: Project list
        file: src/content/projects.json
        fields:
          - name: projects
            label: Projects
            label_singular: project
            widget: list
            summary: '{{fields.no}} — {{fields.client}}: {{fields.project}} ({{fields.year}})'
            fields:
              # Quoted deliberately: YAML 1.1 reads a bare `no` as the boolean
              # false, which would name this field "false" and silently detach
              # it from the JSON key the site reads.
              - { name: 'no', label: 'Row number', widget: number, value_type: int, min: 1 }
              - { name: client, label: Client, widget: string, hint: 'Its own column. Do not repeat it in the project name.' }
              - { name: project, label: 'Project / scope of work', widget: string, hint: 'What was done, without the client name.' }
              - name: scope
                label: 'Distinguishing detail'
                widget: string
                required: false
                hint: >-
                  Only needed where two rows are the same client, work and year.
                  Something that tells them apart — a line number, an area, a
                  work order reference. Shown under the project name.
              - name: year
                label: Year
                widget: number
                value_type: int
                min: 2015
                max: 2100
                hint: 'A single year. Completed work shows the year it finished; ongoing work shows the current year. No ranges.'
              - name: status
                label: Status
                widget: select
                options: [Ongoing, Completed, Extension]
              - { name: location, label: Location, widget: string }
              - name: country
                label: Country
                widget: select
                options: [Uganda, Tanzania, Kenya]
                hint: >-
                  Drives the country filter above the table. Completed projects
                  exist in these three only. Adding a country here also claims
                  it on the map and in the hero ticker — see src/countries.js.
              - name: separateOrder
                label: 'Mark as a separate work order'
                widget: boolean
                required: false
                default: false
                hint: 'Tick where another row looks identical, until the distinguishing detail above is filled in.'

  - name: services
    label: Services
    label_singular: service
    description: 'The methods in the Services We Offer switcher, in order.'
    files:
      - name: services
        label: Service list
        file: src/content/services.json
        fields:
          - name: services
            label: Services
            label_singular: service
            widget: list
            summary: '{{fields.num}} — {{fields.title}}'
            fields:
              - { name: num, label: Number, widget: string, hint: 'Two digits, e.g. 07.' }
              - { name: title, label: Title, widget: string }
              - { name: category, label: 'Category badge', widget: string, hint: 'Shown on the panel image, e.g. Radiation NDT.' }
              - { name: desc, label: Description, widget: text }
              - name: standards
                label: Standards
                widget: string
                hint: 'Must be confirmed by a Level III before publishing. Separate with a middle dot.'
              - name: to
                label: 'Read more link'
                widget: string
                required: false
                default: '/services'
                hint: >-
                  Where the "View Methodologies" button goes. A page path such
                  as /services/paut, or /services#conventional for a section of
                  the services index.
              - name: img
                label: Photograph
                widget: image
                required: false
                hint: 'Leave empty and the panel shows a designed placeholder until a photograph is added.'

  - name: industries
    label: Industries
    label_singular: industry
    description: 'The sectors in the Industries We Serve showcase.'
    files:
      - name: industries
        label: Industry list
        file: src/content/industries.json
        fields:
          - name: industries
            label: Industries
            label_singular: industry
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string, hint: 'Assets covered, separated with middle dots.' }
              - { name: desc, label: Description, widget: text }
              - { name: slug, label: Slug, widget: string, hint: 'Used in the /applications/… URL. Changing it breaks existing links.' }
              - { name: img, label: Photograph, widget: image, required: false }
